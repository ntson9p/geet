# Release pipeline (P10-T5; readied for its first run in POST-P14cr). It
# publishes to the Visual Studio Marketplace as `ntson9p.geet`, from
# github.com/ntson9p/git-tree; docs/releasing.md has the one-time set-up
# (publisher, the VSCE_PAT secret, the two environments) and a release's steps.
#
# Flow: tag v* → full test + perf matrix → package (the channel from the
# version's minor, the bundle budget asserted) → publish that very VSIX: an odd
# minor to the PRE-RELEASE channel; an even minor to STABLE after a manual
# approval (environment "stable" with required reviewers), with a GitHub
# Release carrying the changelog extract and the VSIX. The Marketplace takes a
# version once, so a version is one channel or the other, never both.
# Provenance: third-party actions are pinned to commit shas; dependencies
# install via `npm ci` and are signature-audited.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write # GitHub Release creation in publish-stable

jobs:
  verify:
    name: verify tag ↔ version ↔ channel
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - id: meta
        name: Tag must equal package.json version; odd minor = pre-release (scripts/releaseChannel.mjs)
        run: |
          ver="$(node -p "require('./package.json').version")"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$ver" != "$tag" ]; then
            echo "tag v$tag does not match package.json version $ver" >&2
            exit 1
          fi
          # The rule `npm run package` follows too; it refuses a version the Marketplace would.
          channel="$(node --input-type=module -e "import { releaseChannel } from './scripts/releaseChannel.mjs'; console.log(releaseChannel(process.argv[1]))" "$ver")"
          if [ "$channel" = pre-release ]; then pre=true; else pre=false; fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "prerelease=$pre" >> "$GITHUB_OUTPUT"

  check:
    name: check (typecheck + lint + unit + webview)
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Lockfile provenance audit
        run: npm audit signatures
      - run: npm run check
      - name: Webview component tests (Playwright)
        run: |
          npx playwright install chromium --with-deps
          npm run test:webview

  integration:
    name: integration (${{ matrix.os }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run integration tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:integration
      - name: Run integration tests (Windows/macOS)
        if: runner.os != 'Linux'
        run: npm run test:integration

  perf:
    name: perf budgets (${{ matrix.os }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run perf benchmarks (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:perf
      - name: Run perf benchmarks (Windows/macOS)
        if: runner.os != 'Linux'
        run: npm run test:perf

  package:
    name: package (bundle budget asserted)
    needs: [verify, integration, perf]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # scripts/package.mjs: `vsce package`, with --pre-release for an odd
      # minor; postpackage then runs scripts/checkBundleSize.mjs (< 2.5 MB sans images).
      - run: npm run package
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: geet-vsix
          path: '*.vsix'

  publish-prerelease:
    name: publish → pre-release channel
    needs: [verify, package]
    # Odd minors only: the Marketplace takes a version once, as one channel.
    if: needs.verify.outputs.prerelease == 'true'
    runs-on: ubuntu-latest
    # The VSCE_PAT secret is this environment's.
    environment: pre-release
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The VSIX the package job built and checked, not a second build.
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: geet-vsix
          path: vsix
      - name: vsce publish (pre-release)
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        # --pre-release makes vsce refuse a VSIX that was not packaged as one.
        run: npx vsce publish --pre-release --packagePath vsix/*.vsix -p "$VSCE_PAT"

  publish-stable:
    name: publish → stable + GitHub Release
    needs: [verify, package]
    # Even minors only; the "stable" environment must be configured with
    # required reviewers — that reviewer approval IS the manual gate.
    if: needs.verify.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    environment: stable
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: geet-vsix
          path: vsix
      # Before publishing: a missing section stops the release here.
      - name: Extract changelog section
        run: node scripts/extractChangelog.mjs "${{ needs.verify.outputs.version }}" > release-notes.md
      - name: vsce publish (stable)
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx vsce publish --packagePath vsix/*.vsix -p "$VSCE_PAT"
      - name: GitHub Release with vsix + notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" vsix/*.vsix \
            --title "Geet ${{ needs.verify.outputs.version }}" \
            --notes-file release-notes.md
