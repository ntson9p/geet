<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="'Segoe UI',sans-serif">
  <text x="110" y="45" text-anchor="middle" font-size="14" fill="#0072b2" font-weight="600">Changelists</text>
  <rect x="30" y="60" width="160" height="70" rx="8" fill="#0072b2" opacity="0.12"/>
  <text x="42" y="82" font-size="11" fill="#888">Default Changelist</text>
  <rect x="42" y="92" width="10" height="10" rx="2" fill="#009e73"/><text x="60" y="101" font-size="10" fill="#888">app.ts</text>
  <rect x="42" y="108" width="10" height="10" rx="2" fill="#009e73"/><text x="60" y="117" font-size="10" fill="#888">readme.md</text>
  <rect x="30" y="142" width="160" height="52" rx="8" fill="#cc79a7" opacity="0.12"/>
  <text x="42" y="164" font-size="11" fill="#888">Refactor DB</text>
  <rect x="42" y="174" width="10" height="10" rx="2" fill="none" stroke="#888"/><text x="60" y="183" font-size="10" fill="#888">schema.sql</text>
  <text x="290" y="45" text-anchor="middle" font-size="14" fill="#e69f00" font-weight="600">Staging</text>
  <rect x="210" y="60" width="160" height="60" rx="8" fill="#e69f00" opacity="0.12"/>
  <text x="222" y="82" font-size="11" fill="#888">Staged</text>
  <text x="222" y="103" font-size="10" fill="#888">+ greeting.js (2 hunks)</text>
  <rect x="210" y="134" width="160" height="60" rx="8" fill="#808080" opacity="0.10"/>
  <text x="222" y="156" font-size="11" fill="#888">Unstaged</text>
  <text x="222" y="177" font-size="10" fill="#888">~ notes.md</text>
  <path d="M290 128v-4" stroke="#e69f00" stroke-width="2"/>
  <text x="200" y="245" text-anchor="middle" font-size="13" fill="#888">Hunk- and line-level staging in both styles</text>
  <text x="200" y="266" text-anchor="middle" font-size="12" fill="#888">Switch anytime — GitTree keeps your groups</text>
</svg>
